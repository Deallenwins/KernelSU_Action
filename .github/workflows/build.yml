name: Build KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KernelSU module
        run: |
          sudo apt update
          sudo apt install -y git make gcc clang curl
          git clone --depth 1 https://github.com/tiann/KernelSU -b v0.9.5
          cd KernelSU
          make KSU_ALLOW_UNSUPPORTED=1
          cp kernelsu.ko ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-module
          path: kernelsu.ko